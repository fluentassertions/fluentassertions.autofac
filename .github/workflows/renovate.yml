name: renovate

on:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        default: 'info'
        type: choice
        options: [info, debug]

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # required for the dependency dashboard

    steps:
      - uses: actions/checkout@v7

      # cf.: https://github.com/renovatebot/github-action
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46
        with:
          configurationFile: renovate.json
          # Prefer a fine-grained PAT (secrets.RENOVATE_TOKEN) for full functionality
          # (e.g. dependency dashboard checkboxes); falls back to GITHUB_TOKEN otherwise.
          # NOTE: with GITHUB_TOKEN, PRs opened by this workflow won't auto-trigger other
          # workflows (e.g. build.yml checks) - add RENOVATE_TOKEN later if that's needed.
          token: '${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}'
        env:
          LOG_LEVEL: "${{ inputs.logLevel || 'info' }}"

name: build

on:
  push:
    branches: [main]
    tags: ['*']
    paths-ignore:
      - _docs
      - "**/*.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022 # net47 target requires the .NET Framework dev pack, only available on Windows runners

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0' # Full history needed for GitVersion.MsBuild to compute the version

      # Setup all needed dotnet sdks, cf.:
      # - https://itnext.io/how-to-support-multiple-net-sdks-in-github-actions-workflows-b988daa884e
      # - https://github.com/actions/setup-dotnet
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      # Coverlet instruments (rewrites) the test assemblies, which invalidates their strong-name
      # signature; net47 enforces strong-name verification at load time and fails, so only collect
      # coverage on a modern TFM.
      - name: Test (coverage)
        run: >
          dotnet test --configuration Release --no-build --framework net8.0
          --logger "trx;LogFileName=test-results-coverage.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          retention-days: 14

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: cobertura

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-2022 # net47 target requires the .NET Framework dev pack, only available on Windows runners
    environment: release
    permissions:
      id-token: write # required for NuGet.org trusted publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0' # Full history needed for GitVersion.MsBuild to compute the version

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Pack
        run: dotnet pack FluentAssertions.Autofac/FluentAssertions.Autofac.csproj --configuration Release --output .artifacts

      # cf.: https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: '${{ secrets.NUGET_USER }}'

      - name: Push to NuGet.org
        run: >
          dotnet nuget push .artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
